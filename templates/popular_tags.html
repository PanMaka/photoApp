<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>k29photo - Popular Tags</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            overflow: hidden;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #0056b3;
            color: white;
        }

        .tag-link {
            text-decoration: none;
            color: #0056b3;
            font-weight: bold;
        }

        .tag-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="nav-bar">
        <h1>Trending Tags</h1>
        <p><a href="/">Back to Feed</a></p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Tag</th>
                <th>Number of Photos</th>
            </tr>
        </thead>
        <tbody>
            {% for tag in tags %}
            <tr>
                <td>{{ loop.index }}</td>
                <td><a href="/tag/{{ tag[0] }}" class="tag-link">#{{ tag[0] }}</a></td>
                <td>{{ tag[1] }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" style="text-align: center;">No tags have been created yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>

</html>
