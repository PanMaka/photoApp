<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>k29photo - Upload</title>
</head>

<body>
    <h2>Create an Album & Upload a Photo</h2>

    <form action="/upload" method="POST" enctype="multipart/form-data">
        <label>New Album Name:</label><br>
        <input type="text" name="album_name" required><br><br>

        <label>Photo Caption:</label><br>
        <input type="text" name="caption"><br><br>

        <label>Select Photo:</label><br>
        <input type="file" name="photo_file" accept="image/*" required><br><br>

        <button type="submit">Upload</button>
    </form>
    <br>
    <a href="/">Back to Home</a>
</body>

</html>
